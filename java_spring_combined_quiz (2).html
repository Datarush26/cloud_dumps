<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java · Spring · Mixed Batch — Practice Quiz</title>
<style>
  :root{
    --ink:#1b2430;
    --paper:#f6f4ef;
    --panel:#ffffff;
    --line:#e2ded3;
    --accent:#2f5d50;
    --accent-soft:#e4ece9;
    --good:#1f7a4d;
    --good-bg:#e5f5ec;
    --bad:#b3261e;
    --bad-bg:#fbe9e7;
    --muted:#6b7280;
    --amber:#9c650c;
    --amber-bg:#fdf3df;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;
  }
  .layout{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:290px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:24px 20px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    font-family:'Trebuchet MS', sans-serif;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .brand-title{
    font-size:21px;
    font-weight:700;
    margin:0 0 20px 0;
    line-height:1.25;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:'Trebuchet MS', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin-bottom:6px;
  }
  select{
    width:100%;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .jumprow{ display:flex; gap:6px; }
  .jumprow input{
    width:100%;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    color:var(--ink);
  }
  .jumprow button{
    font-family:'Trebuchet MS', sans-serif;
    font-size:12.5px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    cursor:pointer;
    white-space:nowrap;
  }
  .jumprow button:hover{ border-color:var(--accent); background:var(--accent-soft); }

  .progress-track{
    height:6px; border-radius:99px; background:var(--accent-soft);
    overflow:hidden; margin-top:14px;
  }
  .progress-fill{
    height:100%; background:var(--accent); width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-family:'Trebuchet MS', sans-serif; font-size:11.5px; color:var(--muted);
    margin-top:6px;
  }

  .autonext-row{
    display:flex; align-items:center; gap:8px;
    font-family:'Trebuchet MS', sans-serif; font-size:12.5px; color:var(--ink);
    margin-top:14px; cursor:pointer; user-select:none;
  }
  .autonext-row input{ accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }

  .advance-indicator{
    margin-top:12px;
    font-family:'Trebuchet MS', sans-serif; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:7px;
    opacity:0; transition:opacity .15s ease;
  }
  .advance-indicator.show{ opacity:1; }
  .advance-indicator .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:advancePulse 0.9s ease-in-out infinite;
  }
  @keyframes advancePulse{
    0%,100%{ opacity:.3; transform:scale(.85); }
    50%{ opacity:1; transform:scale(1); }
  }

  .sidebar-footer{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    color:var(--muted);
  }
  .score-pill{
    display:inline-block;
    margin-top:8px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:4px 10px;
    border-radius:999px;
    font-weight:700;
  }
  .sidebar-note{
    margin-top:18px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
    font-style:italic;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:36px 48px 90px; max-width:880px; }
  .top-row{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px; margin-bottom:8px;
  }
  h1.section-title{ font-size:28px; margin:0; font-weight:700; line-height:1.25; }
  .section-meta{
    font-family:'Trebuchet MS', sans-serif;
    color:var(--muted); font-size:13px; margin-bottom:22px;
  }
  .toolbar{
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
    font-family:'Trebuchet MS', sans-serif;
  }
  button.tool-btn{
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:8px; font-size:13px;
    cursor:pointer; color:var(--ink); font-family:'Trebuchet MS', sans-serif;
  }
  button.tool-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  button.tool-btn.confirming{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:700; }

  .qcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 28px;
    margin-bottom:20px;
    min-height:180px;
  }
  .qnum{
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px; color:var(--muted); margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .qnum .cat-badge{
    background:var(--accent-soft); color:var(--accent);
    padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;
  }
  .qtype-badge{
    font-family:'Trebuchet MS', sans-serif;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); border:1px solid var(--line); border-radius:999px;
    padding:2px 8px;
  }
  .qtext{ font-size:18px; line-height:1.55; margin:0 0 16px 0; font-weight:700; }
  .qcode{
    font-family:'SF Mono','Consolas',monospace; font-size:13px;
    background:#1b2430; color:#dfe6ee;
    border-radius:9px; padding:14px 16px; margin:0 0 18px 0;
    overflow-x:auto; white-space:pre; line-height:1.5;
  }
  .options{ display:flex; flex-direction:column; gap:9px; }
  .opt{
    display:flex; align-items:flex-start; gap:11px;
    border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; cursor:pointer; font-size:15.5px; line-height:1.45;
    transition:background .12s ease, border-color .12s ease;
  }
  .opt:hover{ border-color:var(--accent); }
  .opt input{ margin-top:3px; accent-color:var(--accent); flex-shrink:0; }
  .opt.locked{ cursor:default; }
  .opt.correct{ background:var(--good-bg); border-color:var(--good); }
  .opt.incorrect{ background:var(--bad-bg); border-color:var(--bad); }
  .opt-label{ font-family:'Trebuchet MS', sans-serif; font-weight:700; color:var(--muted); flex-shrink:0; }
  .opt.correct .opt-label{ color:var(--good); }
  .opt.incorrect .opt-label{ color:var(--bad); }

  .reveal-box{
    background:var(--accent-soft); border:1px solid var(--line);
    border-radius:9px; padding:14px 16px; font-size:15px; line-height:1.55;
    color:var(--ink);
  }
  .reveal-btn{
    background:var(--accent); color:#fff; border:none;
    padding:9px 18px; border-radius:8px; font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px; cursor:pointer;
  }

  .qfooter{ margin-top:16px; }
  .verdict{ font-family:'Trebuchet MS', sans-serif; font-size:13.5px; font-weight:700; }
  .verdict.good{ color:var(--good); }
  .verdict.bad{ color:var(--bad); }
  .note{
    margin-top:10px; font-family:'Trebuchet MS', sans-serif;
    font-size:12.5px; color:var(--amber); font-style:italic;
    background:var(--amber-bg); border-radius:8px; padding:8px 11px;
  }

  .nav-buttons{
    display:flex; justify-content:space-between; gap:12px; margin-top:6px;
  }
  .nav-btn{
    flex:1;
    background:var(--panel); border:1px solid var(--line);
    padding:13px 18px; border-radius:10px;
    font-family:'Trebuchet MS', sans-serif; font-size:14px; font-weight:700;
    cursor:pointer; color:var(--ink);
  }
  .nav-btn:hover:not(:disabled){ background:var(--accent-soft); border-color:var(--accent); }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .nav-btn.primary:hover:not(:disabled){ filter:brightness(1.08); }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--muted);
    font-family:'Trebuchet MS', sans-serif;
  }

  @media (max-width: 860px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line); }
    .main{ padding:24px 20px 60px; max-width:100%; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Practice Console</div>
    <p class="brand-title">Java · Spring &amp;<br>Spring Boot · Mixed</p>

    <div class="field">
      <label for="sourceSelect">Question set</label>
      <select id="sourceSelect"></select>
    </div>

    <div class="field">
      <label for="categorySelect">Jump to category</label>
      <select id="categorySelect"></select>
    </div>

    <div class="field">
      <label for="jumpInput">Jump to question #</label>
      <div class="jumprow">
        <input type="number" id="jumpInput" min="1" placeholder="e.g. 42">
        <button id="jumpBtn">Go</button>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Question 1 of 1</div>

    <label class="autonext-row">
      <input type="checkbox" id="autoNextToggle" checked>
      <span>Auto-advance after answering</span>
    </label>

    <div class="sidebar-footer">
      Answered: <span id="answeredCount">0</span> / <span id="totalCount">0</span>
      <div class="score-pill">Score: <span id="scoreVal">0</span>/<span id="scoreTotal">0</span></div>
    </div>
    <div class="sidebar-note">Pick an option and it's graded immediately, then the next question loads automatically. Turn that off above if you'd rather move on manually.</div>
  </aside>

  <main class="main">
    <div class="top-row">
      <h1 class="section-title" id="sectionTitle">Question set</h1>
    </div>
    <div class="section-meta" id="sectionMeta"></div>
    <div class="toolbar">
      <button class="tool-btn" id="revealBtn">Reveal this answer</button>
      <button class="tool-btn" id="resetBtn">Reset all progress</button>
    </div>

    <div id="qcardHost"></div>

    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn">&larr; Previous</button>
      <button class="nav-btn primary" id="nextBtn">Next &rarr;</button>
    </div>
    <div class="advance-indicator" id="advanceIndicator"><span class="dot"></span> Advancing to the next question…</div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     STEP 1 — normalize the three source formats into one
     common question shape:
       {
         id: <global unique string>,
         source: 'java' | 'previous' | 'spring',
         sourceLabel: <display name>,
         cat: <section/category label>,
         q: <question text>,
         code: <string|null>,
         type: 'single' | 'multi' | 'reveal',
         options: [<string>, ...],           // [] for reveal
         correct: [<index>, ...],             // indices into options
         revealText: <string|null>,           // answer text for reveal type
         note: <string|null>
       }
     ========================================================= */

  const LETTERS = ['A','B','C','D','E','F','G'];

  function normalizeJavaContinue(){
    const raw = JSON.parse(document.getElementById('src-java-continue').textContent);
    return raw.map((item, i) => {
      const id = 'java-' + i;
      if(item.type === 'reveal' || !item.options){
        return {
          id, source:'java', sourceLabel:'Java — Continued', cat:'Java Core (cont.)',
          q:item.question, code:item.code||null, type:'reveal',
          options:[], correct:[], revealText: Array.isArray(item.answer) ? item.answer.join(', ') : String(item.answer),
          note:item.note||null
        };
      }
      const keys = Object.keys(item.options);
      const options = keys.map(k => item.options[k]);
      const isMulti = item.type === 'multi' || Array.isArray(item.answer);
      let correct;
      if(Array.isArray(item.answer)){
        correct = item.answer.map(a => keys.indexOf(String(a).toLowerCase() === a ? a : a.toLowerCase()));
        // fallback: match case-insensitively against keys
        correct = item.answer.map(a => keys.findIndex(k => k.toLowerCase() === String(a).toLowerCase()));
      } else {
        correct = [keys.findIndex(k => k.toLowerCase() === String(item.answer).toLowerCase())];
      }
      correct = correct.filter(ix => ix >= 0);
      return {
        id, source:'java', sourceLabel:'Java — Continued', cat:'Java Core (cont.)',
        q:item.question, code:item.code||null, type: isMulti ? 'multi' : 'single',
        options, correct, revealText:null, note:item.note||null
      };
    });
  }

  function normalizePreviousBatch(){
    const raw = JSON.parse(document.getElementById('src-previous-batch').textContent);
    return raw.map((item, i) => {
      const id = 'previous-' + i;
      const isMulti = !!item.multi || (item.correct && item.correct.length > 1);
      return {
        id, source:'previous', sourceLabel:'Previous Batch — Mixed Topics', cat:item.cat,
        q:item.q, code:null, type: isMulti ? 'multi' : 'single',
        options:item.opts, correct:item.correct, revealText:null,
        note: item.note || null
      };
    });
  }

  function normalizeSpring(){
    const list = [];
    SRC_SPRING_RAW.forEach((section, si) => {
      section.qs.forEach((item, qi) => {
        list.push({
          id: 'spring-' + si + '-' + qi,
          source:'spring', sourceLabel:'Spring & Spring Boot', cat:section.title,
          q:item.q, code:null, type:'single',
          options:item.o, correct:[item.a], revealText:null,
          note:item.note || null
        });
      });
    });
    return list;
  }

  const ALL_QUESTIONS = [
    ...normalizeJavaContinue(),
    ...normalizePreviousBatch(),
    ...normalizeSpring()
  ];

  const SOURCES = [
    {key:'all', label:'All Sources — Combined'},
    {key:'java', label:'Java — Continued'},
    {key:'previous', label:'Previous Batch — Mixed Topics'},
    {key:'spring', label:'Spring & Spring Boot'}
  ];

  /* =========================================================
     STEP 2 — state + persistence (answers keyed by global id)
     ========================================================= */
  const STORAGE_KEY = 'combinedQuizProgressV1';
  let answers = loadAnswers();
  function loadAnswers(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveAnswers(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); }catch(e){}
  }
  function getAnswer(id){
    if(!answers[id]) answers[id] = {picked:[], checked:false};
    return answers[id];
  }

  const state = {
    sourceKey: 'all',
    filtered: ALL_QUESTIONS.slice(),
    index: 0
  };

  /* =========================================================
     STEP 3 — DOM refs
     ========================================================= */
  const sourceSelect = document.getElementById('sourceSelect');
  const categorySelect = document.getElementById('categorySelect');
  const jumpInput = document.getElementById('jumpInput');
  const jumpBtn = document.getElementById('jumpBtn');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const answeredCountEl = document.getElementById('answeredCount');
  const totalCountEl = document.getElementById('totalCount');
  const scoreValEl = document.getElementById('scoreVal');
  const scoreTotalEl = document.getElementById('scoreTotal');
  const sectionTitle = document.getElementById('sectionTitle');
  const sectionMeta = document.getElementById('sectionMeta');
  const qcardHost = document.getElementById('qcardHost');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const revealBtn = document.getElementById('revealBtn');
  const resetBtn = document.getElementById('resetBtn');
  const autoNextToggle = document.getElementById('autoNextToggle');
  const advanceIndicator = document.getElementById('advanceIndicator');

  const AUTO_NEXT_DELAY = 500;
  let advanceTimer = null;

  function cancelScheduledAdvance(){
    if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
    advanceIndicator.classList.remove('show');
  }

  function scheduleAutoAdvance(qId){
    cancelScheduledAdvance();
    if(!autoNextToggle.checked) return;
    const isLast = state.index >= state.filtered.length - 1;
    if(isLast) return;
    advanceIndicator.classList.add('show');
    advanceTimer = setTimeout(() => {
      advanceIndicator.classList.remove('show');
      // only advance if we're still on the question that triggered this
      const current = state.filtered[state.index];
      if(current && current.id === qId){
        goTo(state.index + 1);
      }
    }, AUTO_NEXT_DELAY);
  }

  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  }

  /* =========================================================
     STEP 4 — populate dropdowns
     ========================================================= */
  function populateSourceSelect(){
    sourceSelect.innerHTML = SOURCES.map(s =>
      `<option value="${s.key}">${escapeHtml(s.label)} — ${
        s.key==='all' ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q=>q.source===s.key).length
      } q</option>`
    ).join('');
    sourceSelect.value = state.sourceKey;
  }

  function categoriesFor(sourceKey){
    const pool = sourceKey === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.source === sourceKey);
    const cats = [];
    pool.forEach(q => { if(!cats.includes(q.cat)) cats.push(q.cat); });
    return cats;
  }

  function populateCategorySelect(){
    const cats = categoriesFor(state.sourceKey);
    categorySelect.innerHTML = '<option value="">— Jump to category —</option>' +
      cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  }

  /* =========================================================
     STEP 5 — filtering / navigation
     ========================================================= */
  function applySourceFilter(){
    cancelScheduledAdvance();
    state.filtered = state.sourceKey === 'all'
      ? ALL_QUESTIONS.slice()
      : ALL_QUESTIONS.filter(q => q.source === state.sourceKey);
    state.index = 0;
    populateCategorySelect();
    render();
  }

  function goTo(idx){
    if(idx < 0 || idx >= state.filtered.length) return;
    cancelScheduledAdvance();
    state.index = idx;
    render();
    qcardHost.scrollIntoView({behavior:'smooth', block:'start'});
  }

  /* =========================================================
     STEP 6 — stats
     ========================================================= */
  function computeStats(){
    let answered = 0, correct = 0, checked = 0;
    state.filtered.forEach(q => {
      const a = getAnswer(q.id);
      if(a.picked.length || (q.type === 'reveal' && a.checked)) answered++;
      if(a.checked){
        checked++;
        if(isCorrect(q, a)) correct++;
      }
    });
    return {answered, correct, checked, total: state.filtered.length};
  }

  function isCorrect(q, a){
    if(q.type === 'reveal') return a.checked;
    const picked = a.picked.slice().sort().join(',');
    const correct = q.correct.slice().sort().join(',');
    return picked === correct;
  }

  function updateStats(){
    const s = computeStats();
    answeredCountEl.textContent = s.answered;
    totalCountEl.textContent = s.total;
    scoreValEl.textContent = s.correct;
    scoreTotalEl.textContent = s.checked;
    progressFill.style.width = (s.total ? (state.index+1)/s.total*100 : 0) + '%';
    progressLabel.textContent = `Question ${state.total0()} of ${s.total}`;
  }
  state.total0 = function(){ return state.filtered.length ? state.index+1 : 0; };

  /* =========================================================
     STEP 7 — render current question
     ========================================================= */
  function render(){
    const total = state.filtered.length;
    sourceSelect.value = state.sourceKey;

    if(total === 0){
      sectionTitle.textContent = 'No questions';
      sectionMeta.textContent = '';
      qcardHost.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
      prevBtn.disabled = true; nextBtn.disabled = true; revealBtn.disabled = true;
      updateStats();
      return;
    }

    const q = state.filtered[state.index];
    const a = getAnswer(q.id);

    sectionTitle.textContent = q.cat;
    sectionMeta.textContent = `${q.sourceLabel} · Question ${state.index+1} of ${total}`;

    const codeHtml = q.code ? `<pre class="qcode">${escapeHtml(q.code)}</pre>` : '';
    const typeLabel = q.type === 'multi' ? 'Select all that apply' : (q.type === 'reveal' ? 'Reference' : 'Single choice');

    let bodyHtml = '';

    if(q.type === 'reveal'){
      bodyHtml = `
        <div class="qtext">${escapeHtml(q.q)}</div>
        ${codeHtml}
        ${a.checked
          ? `<div class="reveal-box"><b>Answer:</b> ${escapeHtml(q.revealText)}</div>`
          : `<button class="reveal-btn" id="revealThisBtn">Show answer</button>`}
      `;
    } else if(q.type === 'multi'){
      const optsHtml = q.options.map((opt, oi) => {
        let cls = 'opt';
        if(a.checked){
          cls += ' locked';
          if(q.correct.includes(oi)) cls += ' correct';
          else if(a.picked.includes(oi)) cls += ' incorrect';
        }
        const checked = a.picked.includes(oi) ? 'checked' : '';
        const disabled = a.checked ? 'disabled' : '';
        return `<label class="${cls}" data-oi="${oi}">
          <input type="checkbox" value="${oi}" ${checked} ${disabled}>
          <span class="opt-label">${LETTERS[oi]||oi}.</span><span>${escapeHtml(opt)}</span>
        </label>`;
      }).join('');
      bodyHtml = `
        <div class="qtext">${escapeHtml(q.q)}</div>
        ${codeHtml}
        <div class="options">${optsHtml}</div>
        ${a.checked ? '' : '<div class="qfooter"><button class="reveal-btn" id="submitMultiBtn">Check answer</button></div>'}
      `;
    } else {
      const optsHtml = q.options.map((opt, oi) => {
        let cls = 'opt';
        if(a.checked){
          cls += ' locked';
          if(q.correct.includes(oi)) cls += ' correct';
          else if(a.picked.includes(oi)) cls += ' incorrect';
        }
        const checked = a.picked.includes(oi) ? 'checked' : '';
        const disabled = a.checked ? 'disabled' : '';
        return `<label class="${cls}" data-oi="${oi}">
          <input type="radio" name="single_${q.id}" value="${oi}" ${checked} ${disabled}>
          <span class="opt-label">${LETTERS[oi]||oi}.</span><span>${escapeHtml(opt)}</span>
        </label>`;
      }).join('');
      bodyHtml = `
        <div class="qtext">${escapeHtml(q.q)}</div>
        ${codeHtml}
        <div class="options">${optsHtml}</div>
      `;
    }

    let verdictHtml = '';
    if(a.checked && q.type !== 'reveal'){
      const ok = isCorrect(q, a);
      verdictHtml = `<div class="qfooter"><span class="verdict ${ok?'good':'bad'}">${
        ok ? '✓ Correct' : (a.picked.length ? '✗ Incorrect — correct answer highlighted above' : 'No answer selected — correct shown above')
      }</span></div>`;
    }

    const noteHtml = (a.checked && q.note) ? `<div class="note">Note: ${escapeHtml(q.note)}</div>` : '';

    qcardHost.innerHTML = `
      <div class="qcard">
        <div class="qnum">
          <span class="cat-badge">${escapeHtml(q.cat)}</span>
          <span class="qtype-badge">${typeLabel}</span>
        </div>
        ${bodyHtml}
        ${verdictHtml}
        ${noteHtml}
      </div>
    `;

    // wire interactions for this render
    if(q.type === 'single'){
      qcardHost.querySelectorAll('input[type=radio]').forEach(inp => {
        inp.addEventListener('change', () => {
          a.picked = [parseInt(inp.value,10)];
          a.checked = true;
          saveAnswers();
          render();
          scheduleAutoAdvance(q.id);
        });
      });
    } else if(q.type === 'multi'){
      qcardHost.querySelectorAll('input[type=checkbox]').forEach(inp => {
        inp.addEventListener('change', () => {
          const oi = parseInt(inp.value,10);
          const set = new Set(a.picked);
          if(inp.checked) set.add(oi); else set.delete(oi);
          a.picked = Array.from(set);
          saveAnswers();
        });
      });
      const submitBtn = document.getElementById('submitMultiBtn');
      if(submitBtn){
        submitBtn.addEventListener('click', () => {
          a.checked = true;
          saveAnswers();
          render();
          scheduleAutoAdvance(q.id);
        });
      }
    } else if(q.type === 'reveal'){
      const btn = document.getElementById('revealThisBtn');
      if(btn){
        btn.addEventListener('click', () => {
          a.checked = true;
          saveAnswers();
          render();
          scheduleAutoAdvance(q.id);
        });
      }
    }

    prevBtn.disabled = state.index === 0;
    nextBtn.disabled = state.index === total - 1;
    revealBtn.disabled = a.checked;

    updateStats();
  }

  /* =========================================================
     STEP 8 — controls
     ========================================================= */
  sourceSelect.addEventListener('change', () => {
    state.sourceKey = sourceSelect.value;
    applySourceFilter();
  });

  categorySelect.addEventListener('change', () => {
    const cat = categorySelect.value;
    if(!cat) return;
    const idx = state.filtered.findIndex(q => q.cat === cat);
    if(idx >= 0) goTo(idx);
  });

  jumpBtn.addEventListener('click', () => {
    const n = parseInt(jumpInput.value, 10);
    if(!isNaN(n)) goTo(n-1);
  });
  jumpInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') jumpBtn.click();
  });

  prevBtn.addEventListener('click', () => goTo(state.index - 1));
  nextBtn.addEventListener('click', () => goTo(state.index + 1));

  revealBtn.addEventListener('click', () => {
    const q = state.filtered[state.index];
    const a = getAnswer(q.id);
    a.checked = true;
    if(q.type !== 'reveal' && a.picked.length === 0){
      // leave picked empty so it shows as "no answer selected" but reveals correct options
    }
    saveAnswers();
    render();
    scheduleAutoAdvance(q.id);
  });

  autoNextToggle.addEventListener('change', () => {
    if(!autoNextToggle.checked) cancelScheduledAdvance();
  });

  let resetConfirmTimer = null;
  resetBtn.addEventListener('click', () => {
    if(!resetBtn.classList.contains('confirming')){
      // first click: arm confirmation, no blocking dialog (some embedded/
      // sandboxed viewers silently block window.confirm, which made this
      // button appear broken)
      resetBtn.classList.add('confirming');
      resetBtn.textContent = 'Click again to confirm reset';
      resetConfirmTimer = setTimeout(() => {
        resetBtn.classList.remove('confirming');
        resetBtn.textContent = 'Reset all progress';
      }, 4000);
      return;
    }
    // second click within the window: actually reset
    clearTimeout(resetConfirmTimer);
    resetBtn.classList.remove('confirming');
    resetBtn.textContent = 'Reset all progress';
    cancelScheduledAdvance();
    answers = {};
    saveAnswers();
    render();
  });

  /* =========================================================
     STEP 9 — boot
     ========================================================= */
  populateSourceSelect();
  populateCategorySelect();
  applySourceFilter();
})();
</script>
</body>
</html>
